version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # dioxus and the wasm-bindgen family must move together (and with the
      # dioxus-cli baked into ghcr.io/afbase/rust-zola-builder).
      dioxus-wasm:
        patterns: ["dioxus*", "wasm-bindgen*", "js-sys", "web-sys"]
      cargo-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/docker-images/cwr-cli"
    schedule:
      interval: "weekly"
